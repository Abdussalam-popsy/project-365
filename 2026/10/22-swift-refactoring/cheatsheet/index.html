<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cheat Sheet · Swift Refactoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="cheatsheet.css">
</head>
<body>
<div class="wrap">
  <a class="crumb" href="../">← Swift Refactoring</a>
  <header>
    <div>
      <h1 id="title">What changed → technique name</h1>
      <p class="sub" id="total"></p>
    </div>
    <input class="search" id="q" type="search" placeholder="Filter, e.g. private(set)" aria-label="Filter" autocomplete="off" spellcheck="false">
  </header>
  <div class="seg view-switch" role="group" aria-label="Cheat sheet">
    <button id="view-tech" data-view="tech" aria-pressed="true">Techniques</button>
    <button id="view-basics" data-view="basics" aria-pressed="false">Swift basics</button>
  </div>
  <section id="techView">
    <p class="how">Compare Before and After, find the row that describes the difference, take the name.</p>
    <div class="cs-box" id="groups"></div>
  </section>
  <section id="basicsView" hidden>
    <p class="how">The Swift words that look alike, side by side.</p>
    <div id="basics"></div>
  </section>
  <p class="empty" id="empty" hidden>Nothing matches that.</p>
</div>

<script src="../shared.js"></script>
<script src="techniques.js"></script>
<script src="basics.js"></script>
<script src="render.js"></script>
<script src="cheatsheet.js"></script>
</body>
</html>
