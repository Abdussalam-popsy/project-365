name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate catalog
        run: node scripts/generate-catalog.js

      - name: Build gallery
        run: |
          mkdir -p _site
          cd gallery && npm install && npm run build
          cp -r dist/. ../_site/
          cd ..
          cp catalog.json _site/catalog.json

      - name: Build all experiments
        run: |
          # Find every experiment with a package.json (Vite/Next projects)
          find 2026 -name "package.json" -not -path "*/node_modules/*" | while read pkg; do
            dir=$(dirname "$pkg")
            # Local-only tools (e.g. Toolcraft tuning apps) opt out with a .skip-deploy marker
            if [ -f "$dir/.skip-deploy" ]; then echo "↷ Skipping $dir"; continue; fi
            echo "→ Building $dir"

            if ls "$dir"/next.config.* >/dev/null 2>&1; then
              # Next.js projects use static export (output: "export") into out/
              (cd "$dir" && npm install && NEXT_BASE_PATH="/project-365/$dir" npx next build)
              out="$dir/out"
            else
              (cd "$dir" && npm install && npx vite build --base="/project-365/$dir/")
              out="$dir/dist"
            fi

            # Copy build output into _site mirroring the folder structure
            if [ -d "$out" ]; then
              mkdir -p "_site/$dir"
              cp -r "$out/." "_site/$dir"
            fi
          done

      - name: Copy vanilla experiments
        run: |
          # Vanilla projects have no package.json — just copy static files as-is
          find 2026 -name "index.html" -not -path "*/node_modules/*" -not -path "*/dist/*" | while read html; do
            dir=$(dirname "$html")
            if [ ! -f "$dir/package.json" ]; then
              echo "→ Copying vanilla $dir"
              mkdir -p "_site/$dir"
              cp -r "$dir/." "_site/$dir/"
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
