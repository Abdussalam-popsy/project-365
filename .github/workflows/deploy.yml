name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build gallery
        run: |
          mkdir -p _site
          cd gallery && npm install && npm run build
          cp -r dist/. ../_site/
          cd ..
          cp catalog.json _site/catalog.json

      - name: Build all experiments
        run: |
          # Find every experiment with a package.json (Vite/Next projects)
          find 2026 -name "package.json" -not -path "*/node_modules/*" | while read pkg; do
            dir=$(dirname "$pkg")
            echo "→ Building $dir"

            (cd "$dir" && npm install && npx vite build --base="/project-365/$dir/")

            # Copy dist/ output into _site mirroring the folder structure
            if [ -d "$dir/dist" ]; then
              mkdir -p "_site/$dir"
              cp -r "$dir/dist/." "_site/$dir"
            fi
          done

      - name: Copy vanilla experiments
        run: |
          # Vanilla projects have no package.json — just copy static files as-is
          find 2026 -name "index.html" -not -path "*/node_modules/*" -not -path "*/dist/*" | while read html; do
            dir=$(dirname "$html")
            if [ ! -f "$dir/package.json" ]; then
              echo "→ Copying vanilla $dir"
              mkdir -p "_site/$dir"
              cp -r "$dir/." "_site/$dir/"
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
